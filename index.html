  <script src="data.js?v=53"></script>
  <script src="app.js?v=53"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        // เปิดแอปกลับมาเมื่อไหร่ ให้เช็คเวอร์ชันใหม่ทันที
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      }).catch(() => {}));
      // มีเวอร์ชันใหม่ติดตั้งเสร็จ → รีโหลดหน้าเองครั้งเดียว
      let reloaded = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    }
  </script>
